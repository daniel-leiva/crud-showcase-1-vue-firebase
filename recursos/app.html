<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">

    <!--Scripts Vuejs-->
    <script src="vue-router.js"></script>
    <script src="vue.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.19.2/axios.min.js"></script>

    <title>App Principal</title>
</head>
<body>

    <div class="container-fluid" id="app">

        <nav class="navbar navbar-dark navbar-expand-lg bg-dark">
            <div class="container-fluid">
              <router-link class="navbar-brand" to="/">Inicio</router-link>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <router-link class="nav-link" to="que_es_vue">¿Qué es Vue?</router-link>
                  </li>
                  <li class="nav-item">
                    <router-link class="nav-link" to="directivas">Directivas</router-link>
                  </li>
                  <li class="nav-item">
                    <router-link class="nav-link" to="componentes">Componentes</router-link>
                  </li>
                  <li class="nav-item">
                    <router-link class="nav-link" to="eventos">Eventos</router-link>
                  </li>
                  <li class="nav-item">
                    <router-link class="nav-link" to="contacto">Contacto</router-link>
                  </li>
                  <li>
                    <router-link class="nav-link" to="alumnos"> Alumnos </router-link>
                  </li>
                  <li class="nav-item">
                    <router-link class="nav-link" to="instructores">Instructores</router-link>
                  </li>
                </ul>
              </div>
            </div>
          </nav>

          <div class="text-center" style="margin-top: 20px;">
            <router-view></router-view>
          </div>

    </div>
    
<!--Vistas-->
<script src="./vistas/contacto.vue.js"></script>
<script src="./vistas/inicio.vue.js"></script>
<script src="./vistas/que_es_vue.vue.js"></script>
<script src="./vistas/directivas.vue.js"></script>
<script src="./vistas/componentes.vue.js"></script>
<script src="./vistas/eventos.vue.js"></script>
<script src="./vistas/alumnos.vue.js"></script>
<script src="./vistas/instructores.vue.js"></script>

<!--Componentes-->
<script src="./componentes/formulario.js"></script>
<script src="./componentes/crear_alumno.js"></script>
<script src="./componentes/cambiar_alumno.js"></script>
<script src="./componentes/crear_instructor.js"></script>
<script src="./componentes/cambiar_instructor.js"></script>

<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>

<!--Instancia Vuejs-->
<script type="text/javascript">
Vue.use(VueRouter); //Indicamos que Vue use VueRouter

    var routes = [
        { path: '/', component: Inicio }, //Creamos una varible routes que contiene el path y su respectivo componente
        { path: '/contacto', component: Contacto },
        { path: '/que_es_vue', component: QueEsVue },
        { path: '/directivas', component: Directivas },
        { path: '/componentes', component: Componentes },
        { path: '/eventos', component: Eventos },
        { path: '/alumnos', component: Alumnos, name: "Alumnos" },
        { path: '/crear_alumno', component: CrearAlumno, name:"crear_alumno" },
        { path: '/cambiar_alumno/:id', component: CambiarAlumno, name:"cambiar_alumno" },
        { path: '/instructores', component: Instructores, name: "Instructores" },
        { path: '/crear_instructor', component: CrearInstructor, name:"crear_instructor" },
        { path: '/cambiar_instructor/:id', component: CambiarInstructor, name:"cambiar_instructor" },

    ];
    var router = new VueRouter({ //Creamos una variable llamada router, que es una instancia de VueRouter
        routes: routes,
    });

    var app = new Vue({
        el: '#app',
        router, router //cramos el router dentro de la variable app
    });
</script>
</body>
</html>
